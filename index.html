<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mobile Site</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;overflow:hidden;background:#fff}
body{position:fixed;inset:0;width:100vw;height:100dvh}
#viewport{position:absolute;inset:0;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;background:#fff}
#app{position:relative;width:390px;height:780px;flex:0 0 auto;transform-origin:top center}
.el{position:absolute}
.button,.text,.image{display:flex;align-items:center}
.button,.image{justify-content:center}
.input input{width:100%;height:100%;padding:10px;border:1px solid #bbb;border-radius:inherit;font:inherit}
</style>
</head>
<body>
<div id="viewport"><div id="app"></div></div>
<script>
const DESIGN_W=390, DESIGN_H=780;
const screens=[{"id":"screen_1","name":"Home","elements":[{"id":"el_epzxzqy","type":"card","x":0,"y":0,"radius":0,"fontSize":16,"action":"","w":390,"h":200,"text":"","bg":"#a455b4","color":"#111"},{"id":"el_mqlgvk2","type":"button","x":0,"y":172,"radius":0,"fontSize":16,"action":"url:https://www.netacad.com/cisco-packet-tracer","w":390,"h":48,"text":"Відкрити посилання","bg":"#000000","color":"#fff","fontWeight":"600"},{"id":"el_dav1ylu","type":"button","x":11,"y":227,"radius":8,"fontSize":16,"action":"goto:","w":106,"h":48,"text":"НА ВІКНО-2","bg":"#000000","color":"#fff","fontWeight":"600"},{"id":"el_kf9wl6n","type":"text","x":5,"y":70,"radius":8,"fontSize":16,"action":"","w":132,"h":40,"text":"Пізда всім це докс прогрпма","bg":"transparent","color":"#ffffff","fontWeight":"600"}]},{"id":"screen_9de5u13","name":"Screen 2","elements":[{"id":"el_ws9zdxj","type":"card","x":0,"y":0,"radius":0,"fontSize":16,"action":"","w":390,"h":97,"text":"","bg":"#783498","color":"#111"},{"id":"el_2oxz5mw","type":"text","x":11,"y":40,"radius":8,"fontSize":16,"action":"","w":66,"h":40,"text":"Усі чеки","bg":"transparent","color":"#ffffff","fontWeight":"600"},{"id":"el_hdq5aw9","type":"button","x":14,"y":104,"radius":0,"fontSize":16,"action":"goto:","w":133,"h":48,"text":"Назад","bg":"#000000","color":"#fff","fontWeight":"600"}]}];
const viewport=document.getElementById('viewport');
const app=document.getElementById('app');
const navHistory=[];
let currentScreen=screens[0]?.id;

function fitDesign(){
  const vw=window.innerWidth;
  const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;
  const scale=vw/DESIGN_W;
  app.style.transform='scale('+scale+')';
  viewport.style.height=vh+'px';
}
function findElement(id){
  return screens.flatMap(s=>s.elements).find(e=>e.id===id);
}
function executeAction(e){
  const action=e.action||'';
  const type=action.split(':')[0];
  const value=action.includes(':')?action.slice(action.indexOf(':')+1):'';
  if(type==='goto' && screens.some(s=>s.id===value)){
    navHistory.push(currentScreen);render(value);
  }else if(type==='back'){
    const prev=navHistory.pop();if(prev)render(prev);
  }else if(type==='url' && value){
    window.open(value,'_blank');
  }else if(type==='alert'){
    alert(value||'Alert');
  }else if(type==='show'){
    const node=app.querySelector('[data-id="'+value+'"]');if(node)node.style.display='';
  }else if(type==='hide'){
    const node=app.querySelector('[data-id="'+value+'"]');if(node)node.style.display='none';
  }else if(type==='scroll'){
    const node=app.querySelector('[data-id="'+value+'"]');if(node)node.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function render(id){
  currentScreen=id;
  app.innerHTML='';
  const s=screens.find(x=>x.id===id)||screens[0];
  s.elements.forEach(e=>{
    if(e.hidden)return;
    const n=document.createElement('div');
    n.className='el '+e.type;
    n.dataset.id=e.id;
    Object.assign(n.style,{
      left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',
      borderRadius:(e.radius||8)+'px',background:e.bg||'transparent',
      color:e.color||'#111',fontSize:(e.fontSize||16)+'px',
      fontWeight:e.fontWeight||'500'
    });
    if(['button','text','image'].includes(e.type))n.textContent=e.text||'';
    if(e.type==='input'){const i=document.createElement('input');i.placeholder=e.text||'';n.appendChild(i)}
    if(e.action)n.onclick=()=>executeAction(e);
    app.appendChild(n);
  });
}
window.addEventListener('resize',fitDesign);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitDesign);
fitDesign();
render(currentScreen);
</script>
</body>
</html>
