<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>PC Remote</title>
  <style>
    :root {
      --bg:#0b0d10; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.035);
      --border:rgba(255,255,255,.10); --text:#f5f7fa; --muted:#8f98a6;
      --ok:#76e39d; --bad:#ff7070;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 50% 0,rgba(255,255,255,.07),transparent 32%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px}
    .wrap{width:min(100%,520px);margin:0 auto}
    .head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}
    .head h1{font-size:25px;margin:0;letter-spacing:-.6px}
    .dot{width:10px;height:10px;border-radius:50%;background:#737b86}
    .dot.online{background:var(--ok);box-shadow:0 0 18px rgba(118,227,157,.45)}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:18px;backdrop-filter:blur(18px)}
    .hidden{display:none!important} .muted{color:var(--muted)}
    .form{display:grid;gap:12px}
    input{width:100%;font-size:16px;padding:15px 16px;border-radius:15px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none}
    button{border:1px solid var(--border);background:var(--panel2);color:var(--text);min-height:48px;border-radius:17px;font:inherit;font-weight:650;cursor:pointer;transition:transform .12s ease,opacity .12s ease}
    button:active{transform:scale(.98)} button:disabled{opacity:.42;cursor:not-allowed}
    .primary{background:white;color:#0b0d10;border-color:white}
    .switch{display:flex;gap:8px;margin-bottom:14px}
    .switch button{flex:1;min-height:42px}
    .switch button.active{background:white;color:#0b0d10}
    .toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logout{padding:9px 12px;min-height:40px;font-size:13px}
    .device-name{font-size:19px;font-weight:750}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
    .action{min-height:112px;padding:15px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
    .action .icon{font-size:25px} .danger{color:var(--bad)}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .badge{padding:7px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted)}
    .msg{min-height:21px;margin-top:13px;text-align:center;font-size:13px;color:var(--muted)}
    @media(max-width:380px){.grid{grid-template-columns:1fr}.action{min-height:88px}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="head"><h1>PC Remote</h1><div id="dot" class="dot"></div></div>

  <section id="authCard" class="card">
    <div class="switch">
      <button id="loginMode" class="active" type="button">Вхід</button>
      <button id="signupMode" type="button">Реєстрація</button>
    </div>
    <div class="form">
      <input id="email" type="email" autocomplete="username" placeholder="Email">
      <input id="password" type="password" autocomplete="current-password" placeholder="Пароль (мін. 6 символів)">
      <button id="authBtn" class="primary">Увійти</button>
    </div>
  </section>

  <section id="controlCard" class="card hidden">
    <div class="toprow">
      <div>
        <div class="device-name">Мій ПК</div>
        <div id="state" class="muted" style="font-size:13px;margin-top:4px">Перевірка...</div>
      </div>
      <button id="logoutBtn" class="logout">Вийти</button>
    </div>

    <div class="grid">
      <button class="action" data-action="lock"><span class="icon">🔒</span><span>Заблокувати</span></button>
      <button class="action" data-action="sleep"><span class="icon">◌</span><span>Сон</span></button>
      <button class="action" data-action="restart"><span class="icon">↻</span><span>Перезавантажити</span></button>
      <button class="action danger" data-action="shutdown"><span class="icon">⏻</span><span>Вимкнути</span></button>
    </div>

    <div class="badges">
      <span class="badge">Device: home-pc</span>
      <span id="userBadge" class="badge">User: ...</span>
    </div>
  </section>

  <div id="message" class="msg"></div>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://hfxzdifqcjbslmxffvlf.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Z3cDbEmw_8OcJsXAwypOfw_-IwC-RFi';
  const DEVICE_ID = 'home-pc';

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const $ = id => document.getElementById(id);
  let mode = 'login';
  let user = null;
  let timer = null;

  function say(text) {
    $('message').textContent = text;
    clearTimeout(say.t);
    say.t = setTimeout(() => $('message').textContent = '', 3500);
  }

  function setMode(next) {
    mode = next;
    $('loginMode').classList.toggle('active', next === 'login');
    $('signupMode').classList.toggle('active', next === 'signup');
    $('authBtn').textContent = next === 'login' ? 'Увійти' : 'Створити акаунт';
  }

  async function auth() {
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || password.length < 6) return say('Введи email і пароль від 6 символів');

    $('authBtn').disabled = true;
    let result;

    if (mode === 'login') {
      result = await supabase.auth.signInWithPassword({ email, password });
    } else {
      result = await supabase.auth.signUp({ email, password });
    }

    $('authBtn').disabled = false;

    if (result.error) return say(result.error.message);

    if (mode === 'signup' && !result.data.session) {
      return say('Акаунт створено. Якщо підтвердження email вимкнене в Supabase, просто увійди.');
    }

    showControl(result.data.user);
  }

  function showControl(u) {
    user = u;
    $('authCard').classList.add('hidden');
    $('controlCard').classList.remove('hidden');
    $('userBadge').textContent = 'User: ' + u.id.slice(0,8) + '…';
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 5000);
  }

  function showAuth() {
    user = null;
    clearInterval(timer);
    $('authCard').classList.remove('hidden');
    $('controlCard').classList.add('hidden');
    $('dot').classList.remove('online');
  }

  async function refresh() {
    if (!user) return;

    const { data, error } = await supabase
      .from('pc_devices')
      .select('status,last_seen')
      .eq('id', DEVICE_ID)
      .maybeSingle();

    if (error || !data) {
      $('dot').classList.remove('online');
      $('state').textContent = 'Агент ще не підключений';
      return;
    }

    const online = data.status === 'online'
      && data.last_seen
      && (Date.now() - new Date(data.last_seen).getTime()) < 25000;

    $('dot').classList.toggle('online', online);
    $('state').textContent = online ? 'Онлайн' : 'Офлайн';
  }

  async function send(action) {
    const q = {
      lock:'Заблокувати ПК?', sleep:'Перевести ПК у сон?',
      restart:'Перезавантажити ПК?', shutdown:'Вимкнути ПК?'
    }[action];

    if (!confirm(q)) return;

    const { error } = await supabase.from('pc_commands').insert({
      user_id:user.id, device_id:DEVICE_ID, action
    });

    if (error) return say(error.message);
    say('Команду відправлено');
  }

  $('loginMode').addEventListener('click', () => setMode('login'));
  $('signupMode').addEventListener('click', () => setMode('signup'));
  $('authBtn').addEventListener('click', auth);
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') auth(); });

  $('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    showAuth();
  });

  document.querySelectorAll('[data-action]').forEach(btn =>
    btn.addEventListener('click', () => send(btn.dataset.action))
  );

  const { data: { session } } = await supabase.auth.getSession();
  session?.user ? showControl(session.user) : showAuth();
</script>
</body>
</html>
